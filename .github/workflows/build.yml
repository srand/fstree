name: Build Executable

on:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-executable:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: macos-latest
    steps:
    - name: Install Git in manylinux container
      if: matrix.os == 'ubuntu-latest'
      run: |
        yum install -y git ca-certificates redhat-lsb-core perl-IPC-Cmd perl-Time-Piece perl-Pod-Html
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Mark workspace as safe Git directory
      if: matrix.os == 'ubuntu-latest'
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Set up Python in manylinux container
      if: matrix.os == 'ubuntu-latest'
      run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
    - name: Set up Python
      if: matrix.os != 'ubuntu-latest'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade jolt==0.9.489 pyyaml
    - name: Install dependencies on Windows
      if: matrix.os == 'windows-latest'
      run: |
        choco install diffutils

    - name: Restore Jolt Cache
      id: jolt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/cache
        key: jolt-cache-${{ runner.os }}

    - name: Setup MSVC environment
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
      if: matrix.os == 'windows-latest'
    - name: Create version header and update pyproject.toml
      run: python scripts/version.py ${{ github.run_number}}
    - name: Build fstree
      if: matrix.os == 'windows-latest'
      run: python -m jolt -c jolt.cachedir=${{ github.workspace }}/cache build fstree/deps -c sysroot/ -vvv
    - name: Build and test fstree
      if: matrix.os != 'windows-latest'
      run: python -m jolt -c jolt.cachedir=${{ github.workspace }}/cache build fstree tests -c sysroot/ -vvv

    - name: Save Jolt Cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/cache
        key: jolt-cache-${{ runner.os }}

    - name: Strip binary
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
      run: strip sysroot/bin/fstree
    - name: Rename binary
      if: matrix.os == 'windows-latest'
      run: mv sysroot/bin/fstree.exe sysroot/bin/fstree-windows-x86_64.exe
    - name: Rename binary
      if: matrix.os == 'ubuntu-latest'
      run: mv sysroot/bin/fstree sysroot/bin/fstree-linux-x86_64
    - name: Rename binary
      if: matrix.os == 'macos-latest'
      run: mv sysroot/bin/fstree sysroot/bin/fstree-darwin-x86_64
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: ./sysroot/bin

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade jolt==0.9.489 pyyaml cibuildwheel
    - name: Install dependencies on Windows
      if: matrix.os == 'windows-latest'
      run: |
        choco install diffutils

    - name: Restore Jolt Cache
      id: jolt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/cache
        key: jolt-cache-wheels-${{ runner.os }}

    - name: Setup MSVC environment
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
      if: matrix.os == 'windows-latest'
    - name: Create version header and update pyproject.toml
      run: python scripts/version.py ${{ github.run_number}}
    - name: Build wheel deps
      if: matrix.os != 'ubuntu-latest'
      run: python -m jolt -c jolt.cachedir=${{ github.workspace }}/cache build fstree/deps -c sysroot/ -vvv
    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3.1
    - name: Save Jolt Cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/cache
        key: jolt-cache-wheels-${{ runner.os }}
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  release:
    needs:
      - build-executable
      - build-wheels
    environment: production
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PyPI upload dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade twine
    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-latest
    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: binary-ubuntu-latest
    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-latest
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-macos-latest
        path: dist
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: dist
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-windows-latest
        path: dist
    - name: Get date
      id: date
      run: echo ::set-output name=date::$(date +%y.%m)
    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.date.outputs.date }}.${{ github.run_number }}
        release_name: ${{ steps.date.outputs.date }}.${{ github.run_number }}
        body: |
          This is the release of the ${{ github.run_number }} build.
        draft: false
        prerelease: false
    - name: Upload wheel assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.date.outputs.date }}.${{ github.run_number }}
      run: |
        shopt -s nullglob
        for wheel in dist/*.whl; do
          gh release upload "$TAG" "$wheel" --repo "$GITHUB_REPOSITORY" --clobber
        done
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: fstree-windows-x86_64.exe
        asset_name: fstree-windows-x86_64.exe
        asset_content_type: application/octet-stream
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: fstree-linux-x86_64
        asset_name: fstree-linux-x86_64
        asset_content_type: application/octet-stream
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: fstree-darwin-x86_64
        asset_name: fstree-darwin-x86_64
        asset_content_type: application/octet-stream
    - name: Release to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      run: |
        python -m twine check dist/*.whl
        python -m twine upload dist/*.whl
